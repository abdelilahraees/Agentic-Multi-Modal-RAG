<div class="layout">
  <aside class="sidebar">
    <div class="brand">
      <span class="logo" aria-hidden="true">◆</span>
      <div>
        <strong>Agentic RAG</strong>
        <span class="muted small">Multimodal · pgvector · LangChain4j</span>
      </div>
    </div>

    <label class="user">
      <span class="muted small">Utilisateur</span>
      <input
        type="text"
        [ngModel]="session.userId()"
        (change)="changeUser($any($event.target).value)"
        maxlength="64"
      />
    </label>

    <app-documents-panel class="panel" />
    <app-transactions-panel class="panel" />
  </aside>

  <main class="main">
    <app-chat />
  </main>
</div>
